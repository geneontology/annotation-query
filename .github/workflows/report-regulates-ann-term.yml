on:
  issues:
    types: [opened] # change to "locked"?

jobs:

  run-regulates-report-on-issue:
    if: contains(github.event.issue.labels.*.name, 'reg_ann_to_list_of_terms')
    runs-on: ubuntu-22.04
    name: Add issue comment
    steps:
      - name: Proof of env
        env:
          NUMBER: ${{ github.event.issue.number }}
        run: |
          echo A comment on issue $NUMBER
      - name: Checkout this repo
        uses: actions/checkout@v2
        with:
          ref: ${{ github.head_ref }}
      - name: Run main annotation script
        env:
          NUMBER: ${{ github.event.issue.number }}
        run: mkdir -p reports/$NUMBER && python3 ./scripts/annotation-review-report.py geneontology/annotation-query 7 --number $NUMBER --label reg_ann_to_list_of_terms --field regulates_closure --output ./reports/$NUMBER --verbose
      - name: Run extensions annotation script
        env:
          NUMBER: ${{ github.event.issue.number }}
        run: mkdir -p reports/$NUMBER && python3 ./scripts/annotation-review-report.py geneontology/annotation-query 7 --number $NUMBER --label reg_ann_to_list_of_terms --field annotation_extension_class --output ./reports/$NUMBER --prefix extensions --verbose
      - name: Run evidence_with annotation script
        env:
          NUMBER: ${{ github.event.issue.number }}
        run: mkdir -p reports/$NUMBER && python3 ./scripts/annotation-review-report.py geneontology/annotation-query 7 --number $NUMBER --label reg_ann_to_list_of_terms --field evidence_with --output ./reports/$NUMBER --prefix ev_with --verbose
      - name: Run mapping hit script
        env:
          NUMBER: ${{ github.event.issue.number }}
        run: mkdir -p reports/$NUMBER && wget --recursive --no-parent --no-host-directories --cut-dirs=2 --directory-prefix=$RUNNER_TEMP/external2go https://current.geneontology.org/ontology/external2go/ && rm -f $RUNNER_TEMP/external2go/{README.md,index.html,robots.txt,pfam2go,pirsf2go,prints2go,prodom2go,prosite2go,smart2go} && python3 ./scripts/mapping-report.py geneontology/annotation-query 7 --number $NUMBER --label reg_ann_to_list_of_terms --input $RUNNER_TEMP/external2go/ --output ./reports/$NUMBER --verbose
      - name: Commit and push reports
        env:
          NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.email sjcarbon@lbl.gov
          git config user.name sjcarbon
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "Reports at https://github.com/geneontology/annotation-query/tree/main/reports/${NUMBER} for issue https://github.com/geneontology/annotation-query/issues/${NUMBER}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((RANDOM % 5 + 3))
          done
          exit 1
